<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel-Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Travel Dashboard</h1>
        <p>Enter City to view Weather, Events, and more</p>
      </header>

      <!-- <div class="search-box">
        <input type="text" id="lat" placeholder="Latitude (e.g. 40.71)" />
        <input type="text" id="lon" placeholder="Longitude (e.g. -74.00)" />
        <button onclick="sendData()">Get Weather</button>
      </div> -->
      <div class="search-box">
        <input
          type="text"
          id="city"
          placeholder="City Name (e.g. New York City)"
        /><button onclick="sendCityData()">Get City Information</button>
      </div>

      <div id="results1" class="time-container"></div>
      <div id="results2"></div>
      <div id="results3" class="events-container"></div>
    </div>

    <script>
      async function sendCityData() {
        const city = document.getElementById("city").value;
        const results1Div = document.getElementById("results1");
        const results2Div = document.getElementById("results2");
        const results3Div = document.getElementById("results3");

        if (!city) {
          alert("Please enter a City name");
          return;
        }

        results1Div.innerHTML = "<p class='loading'>Fetching the Time...</p>";
        results2Div.innerHTML = "<p class='loading'>Fetching the Skies...</p>";
        results3Div.innerHTML = "<p class='loading'>Fetching the Events...</p>";

        // Try fetching the Timezone and time
        try {
          const response1 = await fetch("/get_city_time", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ city: city }),
          });

          if (!response1.ok) {
            throw new Error("Server returned an error for get city time");
          }

          const data = await response1.json();
          results1Div.innerHTML = "";

          const timezone = data.timezone;
          const time = data.current_time;

          results1Div.innerHTML += `<h2>Time</h2>`;
          results1Div.innerHTML += `<div class="time-card">
            <p><strong>City Timezone: </strong>${timezone}</p>
            <p><strong>Current Time: </strong>${time}</p>
            </div>`;
        } catch (error) {
          console.log(error);
          results1Div.innerHTML =
            "<p class='error'>Failed to load Time and Timezone.</p>";
        }

        // Try fetching the Weather
        try {
          const response2 = await fetch("/get_city_weather", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ city: city }),
          });

          if (!response2.ok) {
            throw new Error("Server returned an error for get city weather");
          }

          const data = await response2.json();
          results2Div.innerHTML = "";

          results2Div.innerHTML += `<h2>Weather</h2><div id="results22" class="forecast-container"></div>`;
          results22Div = document.getElementById("results22");
          data.forEach((day) => {
            // Create a card for each forecast day
            const dateObj = new Date(day.date);
            const dayName = dateObj.toLocaleDateString("en-US", {
              weekday: "long",
            });
            const shortDate = dateObj.toLocaleDateString("en-US", {
              month: "short",
              day: "numeric",
            });

            results22Div.innerHTML += `
                <div class="weather-card">
                    <h3>${dayName}</h3>
                    <span class="date">${shortDate}</span>
                    <div class="temp">${Math.round(day.temp)}°F</div>
                    <p class="desc">${day.desc}</p>
                </div>
              `;
          });
        } catch (error) {
          console.log(error);
          results2Div.innerHTML =
            "<p class='error'>Failed to load Weather data. Check your API key or coordinates.</p>";
        }

        // Try fetching the Events
        try {
          const response3 = await fetch("/get_city_events", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ city: city }),
          });

          if (!response3.ok) {
            throw new Error("Server returned an error for get city events");
          }

          const data = await response3.json();
          results3Div.innerHTML = "";

          results3Div.innerHTML += `<h2>Events</h2>`;
          data.forEach((event) => {
            // Extracting fields from the SerpApi event object
            const title = event.title;
            const when = event.date.when; // e.g., "Sat, Mar 28, 3 – 9 PM"
            const venueName = event.venue.name;
            const eventLink = event.link;
            const thumbnail = event.thumbnail;

            results3Div.innerHTML += `
        <div class="event-card">
            ${thumbnail ? `<img src="${thumbnail}" alt="${title}" class="event-img">` : ""}
            <div class="event-info">
                <h3>${title}</h3>
                <p class="event-date"><strong>When:</strong> ${when}</p>
                <p class="event-venue"><strong>Location:</strong> ${venueName}</p>
                <a href="${eventLink}" target="_blank" class="event-btn">View Tickets</a>
            </div>
        </div>
    `;
          });
        } catch (error) {
          console.log(error);
          results3Div.innerHTML =
            "<p class='error'>Failed to load City Events. Check your API key.</p>";
        }
      }

      async function sendData() {
        const lat = document.getElementById("lat").value;
        const lon = document.getElementById("lon").value;
        const resultsDiv = document.getElementById("results");

        if (!lat || !lon) {
          alert("Please enter both latitude and longitude.");
          return;
        }

        resultsDiv.innerHTML = "<p class='loading'>Fetching the skies...</p>";

        try {
          const response = await fetch("/get_weather", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ lat: lat, lon: lon }),
          });

          const data = await response.json();
          resultsDiv.innerHTML = "";

          data.forEach((day) => {
            // Create a card for each forecast day
            const dateObj = new Date(day.date);
            const dayName = dateObj.toLocaleDateString("en-US", {
              weekday: "long",
            });
            const shortDate = dateObj.toLocaleDateString("en-US", {
              month: "short",
              day: "numeric",
            });

            resultsDiv.innerHTML += `
                <div class="weather-card">
                    <h3>${dayName}</h3>
                    <span class="date">${shortDate}</span>
                    <div class="temp">${Math.round(day.temp)}°F</div>
                    <p class="desc">${day.desc}</p>
                </div>
              `;
          });
        } catch (error) {
          resultsDiv.innerHTML =
            "<p class='error'>Failed to load data. Check your API key or coordinates.</p>";
        }
      }
    </script>
  </body>
</html>
